# Oman Photo — Nginx reverse proxy (Next.js blue/green slots).
# The active upstream port is written by scripts/zero-downtime-deploy.sh into
# /root/omanphoto/docker/nginx-upstream-generated.conf, which defines
# `upstream omanphoto_web { server 127.0.0.1:<active-port>; ... }`.
#
# Deploy = update the included file + `nginx -s reload`. Never hardcode the port here.

include /root/omanphoto/docker/nginx-upstream-generated.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP — ACME + redirect to canonical HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name omanphoto.com www.omanphoto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://omanphoto.com$request_uri;
    }
}

# HTTPS www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.omanphoto.com;

    ssl_certificate /etc/letsencrypt/live/omanphoto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omanphoto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://omanphoto.com$request_uri;
}

# HTTPS apex — application
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name omanphoto.com;

    ssl_certificate /etc/letsencrypt/live/omanphoto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omanphoto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://omanphoto_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100M;
    }
}
