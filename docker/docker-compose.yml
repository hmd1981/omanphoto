# Blue/green: web-blue (127.0.0.1:3001) and web-green (127.0.0.1:3002). Active slot in repo root `.active-slot`.
# CI: service `web` on 127.0.0.1:3000 with profile `ci` (see scripts/ci-pipeline.sh, COMPOSE_PROFILES=ci).

x-web-common: &web_common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://omanphoto:omanphoto_dev@db:5432/omanphoto?schema=public
    JWT_SECRET: ${JWT_SECRET:-please-set-jwt-secret-in-production-min-32-chars}
    # Default studio login password (override in production). Locked out: `cd app && npm run admin:reset-password`.
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    # Never overwrite production CMS on container start or db:seed (see prisma/cms-baseline.json).
    OMANPHOTO_PRESERVE_CMS: ${OMANPHOTO_PRESERVE_CMS:-1}
    OMANPHOTO_SEED_DEMO: ${OMANPHOTO_SEED_DEMO:-0}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://omanphoto.com}
    NEXT_PUBLIC_WHATSAPP_E164: ${NEXT_PUBLIC_WHATSAPP_E164:-96890000000}
    NEXT_PUBLIC_INSTAGRAM_HANDLE: ${NEXT_PUBLIC_INSTAGRAM_HANDLE:-omanphoto}
    # AI sales assistant — server-side; secrets sourced from docker/.env (0600, gitignored).
    NEXT_PUBLIC_ASSISTANT_ENABLED: ${NEXT_PUBLIC_ASSISTANT_ENABLED:-0}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    UPLOAD_DIR: /opt/omanphoto/uploads
    NODE_ENV: production
  volumes:
    - uploads:/opt/omanphoto/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omanphoto
      POSTGRES_PASSWORD: omanphoto_dev
      POSTGRES_DB: omanphoto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omanphoto -d omanphoto"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *web_common
    profiles: ["ci"]
    ports:
      - "127.0.0.1:3000:3000"

  web-blue:
    <<: *web_common
    ports:
      - "127.0.0.1:3001:3000"

  web-green:
    <<: *web_common
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  pgdata:
  uploads:
