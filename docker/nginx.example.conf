# Example Nginx site for omanphoto.com — place in /etc/nginx/sites-available/ and enable when ready.
# TLS is typically handled with certbot (Let's Encrypt).

upstream omanphoto_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name omanphoto.com www.omanphoto.com;

  client_max_body_size 64m;

  location /_next/static/ {
    proxy_pass http://omanphoto_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/media/file/ {
    proxy_pass http://omanphoto_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://omanphoto_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
